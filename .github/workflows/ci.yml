name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  OPENROUTER_VIDEO_CONTRACT_BASELINE: contracts/product/baselines/op07-frozen-058f5bc.json
  OPENROUTER_VIDEO_CONTRACT_DELTA: contracts/product/deltas/op07-discovery-remediation.contract-delta.json

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src tests
      - name: Read-only public capability drift report
        continue-on-error: true
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 30 --max-filesize 2097152 https://openrouter.ai/api/v1/videos/models -o "$RUNNER_TEMP/video-models.json"
          python scripts/report_capability_completeness.py --current "$RUNNER_TEMP/video-models.json" --previous tests/fixtures/op07-full-catalogue.json --output "$RUNNER_TEMP/capability-drift.json" --summary "$GITHUB_STEP_SUMMARY"
      - run: python -m build
      - run: python scripts/verify_release_artifacts.py --dist dist
      - run: python -m pip_audit

  test:
    name: ${{ matrix.check-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            check-name: test-linux-py310
          - os: ubuntu-latest
            python: "3.13"
            check-name: test-linux-py313
          - os: windows-latest
            python: "3.10"
            check-name: test-windows-py310
          - os: windows-latest
            python: "3.13"
            check-name: test-windows-py313
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node --test tests/contract/*.mjs
